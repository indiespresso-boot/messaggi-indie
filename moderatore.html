<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moderatore — Messaggi Indie</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>* { margin:0; padding:0; box-sizing:border-box; }
:root { --deep:#0d0d14; --card:#16161f; --card2:#1c1c28; --border:#2a2a3a; --accent:#e8ff47; --accent2:#ff4d6d; --green:#4dff91; --text:#f0f0f0; --muted:#6b6b7e; --muted2:#4a4a5e; }
body { font-family:'DM Sans',sans-serif; background:var(--deep); color:var(--text); min-height:100vh; }
@keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(1.4)} }
@keyframes pop-in { from{transform:scale(0);opacity:0} to{transform:scale(1);opacity:1} }
@keyframes fade-up { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
@keyframes slide-in { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
@keyframes scan-line { 0%,100%{opacity:.3} 50%{opacity:.9} }
@keyframes float-up { 0%{opacity:0;transform:translateY(0) scale(0)} 10%{opacity:.6} 90%{opacity:.2} 100%{opacity:0;transform:translateY(-100vh) scale(1.5)} }
.toast { position:fixed; bottom:24px;left:50%; transform:translateX(-50%) translateY(80px); background:var(--card2); border:1px solid var(--border); border-radius:12px; padding:12px 20px; font-size:13px; font-weight:500; color:var(--text); z-index:9999; transition:transform .3s cubic-bezier(.34,1.56,.64,1); white-space:nowrap; display:flex; align-items:center; gap:8px; }
.toast.show { transform:translateX(-50%) translateY(0); }
.toast.success { border-color:rgba(77,255,145,.3); }
.toast.error { border-color:rgba(255,77,109,.3); }
.live-dot { width:7px; height:7px; border-radius:50%; background:var(--accent2); animation:pulse-dot 1.4s ease-in-out infinite; }
::-webkit-scrollbar{width:6px} ::-webkit-scrollbar-track{background:transparent} ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
#wrap { padding:28px 24px; max-width:1100px; margin:0 auto; }
.dash-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; flex-wrap:wrap; gap:16px; }
.dash-title { font-family:'Syne',sans-serif; font-size:22px; font-weight:900; letter-spacing:-.03em; }
.dash-title span { color:var(--accent); }
.dash-stats { display:flex; gap:12px; flex-wrap:wrap; }
.stat-pill { padding:6px 14px; border-radius:20px; font-size:12px; font-weight:600; border:1px solid var(--border); background:var(--card); display:flex; align-items:center; gap:6px; }
.stat-pill .dot { width:6px; height:6px; border-radius:50%; }
.dot-pending{background:#ffb347} .dot-approved{background:var(--green)} .dot-rejected{background:var(--accent2)}
.settings-panel { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:22px 24px; margin-bottom:24px; }
.settings-title { font-family:'Syne',sans-serif; font-size:13px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:16px; display:flex; align-items:center; gap:8px; }
.settings-title::before { content:'⚙'; color:var(--accent); }
.settings-grid { display:grid; grid-template-columns:1fr 1fr 1fr auto; gap:12px; align-items:end; }
@media(max-width:700px){ .settings-grid{grid-template-columns:1fr 1fr} }
.s-group { display:flex; flex-direction:column; gap:6px; }
.s-label { font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
.s-input { background:rgba(255,255,255,.05); border:1px solid var(--border); border-radius:9px; padding:9px 12px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:13px; outline:none; }
.s-input:focus { border-color:rgba(232,255,71,.5); }
.color-row { display:flex; gap:8px; align-items:center; }
.s-color { width:36px; height:36px; border-radius:8px; border:2px solid var(--border); cursor:pointer; padding:2px; background:transparent; }
.btn-apply { padding:10px 20px; background:var(--accent); color:#0a0a0a; font-family:'Syne',sans-serif; font-size:12px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; border:none; border-radius:9px; cursor:pointer; height:38px; }
.btn-apply:hover { opacity:.88; }
.queue-section { margin-bottom:24px; }
.queue-label { font-family:'Syne',sans-serif; font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:12px; display:flex; align-items:center; gap:8px; }
.queue-count { background:#ffb347; color:#0a0a0a; border-radius:10px; padding:1px 7px; font-size:10px; font-weight:800; }
.queue-count.green { background:var(--green); }
.msg-list { display:flex; flex-direction:column; gap:10px; }
.msg-card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px 18px; display:flex; align-items:flex-start; gap:14px; transition:border-color .2s; animation:slide-in .25s ease; }
.msg-card:hover { border-color:#3a3a4e; }
.msg-card.approved { border-color:rgba(77,255,145,.25); background:rgba(77,255,145,.03); }
.msg-avatar { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Syne',sans-serif; font-size:13px; font-weight:800; color:#0a0a0a; flex-shrink:0; }
.msg-body { flex:1; min-width:0; }
.msg-sender { font-size:12px; font-weight:600; color:var(--muted); margin-bottom:4px; display:flex; align-items:center; gap:8px; }
.msg-sender strong { color:var(--text); }
.msg-time { font-size:10px; color:var(--muted2); }
.msg-text { font-size:14px; color:var(--text); line-height:1.5; }
.msg-actions { display:flex; gap:8px; flex-shrink:0; margin-top:2px; }
.btn-approve,.btn-reject { padding:7px 16px; border-radius:8px; font-family:'Syne',sans-serif; font-size:11px; font-weight:700; cursor:pointer; border:none; transition:all .15s; }
.btn-approve { background:rgba(77,255,145,.15); color:var(--green); border:1px solid rgba(77,255,145,.3); }
.btn-approve:hover { background:rgba(77,255,145,.25); }
.btn-reject { background:rgba(255,77,109,.12); color:var(--accent2); border:1px solid rgba(255,77,109,.25); }
.btn-reject:hover { background:rgba(255,77,109,.22); }
.btn-undo { padding:7px 14px; border-radius:8px; font-family:'Syne',sans-serif; font-size:11px; font-weight:700; cursor:pointer; border:1px solid var(--border); background:transparent; color:var(--muted); }
.btn-undo:hover { color:var(--text); border-color:#555; }
.empty-state { text-align:center; padding:40px 20px; color:var(--muted2); font-size:13px; }
.empty-state .empty-icon { font-size:28px; margin-bottom:8px; }</style>
</head>
<body>
<div id="wrap">
  <div class="dash-header">
    <div class="dash-title">Dashboard <span>Moderatore</span></div>
    <div class="dash-stats">
      <div class="stat-pill"><div class="dot dot-pending"></div><span id="stat-pending">0</span> in attesa</div>
      <div class="stat-pill"><div class="dot dot-approved"></div><span id="stat-approved">0</span> approvati</div>
      <div class="stat-pill"><div class="dot dot-rejected"></div><span id="stat-rejected">0</span> rifiutati</div>
    </div>
  </div>
  <div class="settings-panel">
    <div class="settings-title">Impostazioni Schermo Live</div>
    <div class="settings-grid">
      <div class="s-group">
        <div class="s-label">Nome Evento</div>
        <input class="s-input" id="s-event-name" type="text" placeholder="Es. MARCO LIVE">
      </div>
      <div class="s-group">
        <div class="s-label">Sottotitolo</div>
        <input class="s-input" id="s-event-sub" type="text">
      </div>
      <div class="s-group">
        <div class="s-label">Colore Accento</div>
        <div class="color-row">
          <input class="s-color" id="s-color" type="color" value="#e8ff47">
          <input class="s-input" id="s-color-hex" type="text" value="#e8ff47" style="flex:1" maxlength="7">
        </div>
      </div>
      <button class="btn-apply" onclick="applySettings()">Applica</button>
    </div>
  </div>
  <div class="queue-section">
    <div class="queue-label">In attesa <span class="queue-count" id="pending-count">0</span></div>
    <div class="msg-list" id="list-pending">
      <div class="empty-state"><div class="empty-icon">📭</div>Nessun messaggio in attesa</div>
    </div>
  </div>
  <div class="queue-section">
    <div class="queue-label">Approvati <span class="queue-count green" id="approved-count">0</span></div>
    <div class="msg-list" id="list-approved">
      <div class="empty-state"><div class="empty-icon">✅</div>Nessun messaggio approvato ancora</div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onValue, update, remove, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyApLhRbbVD2J84mVLEx8yMHI93U-D-ofQQ",
  authDomain: "messaggi-indie.firebaseapp.com",
  databaseURL: "https://messaggi-indie-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "messaggi-indie",
  storageBucket: "messaggi-indie.firebasestorage.app",
  messagingSenderId: "955832496076",
  appId: "1:955832496076:web:77fdcbd958842f65673769"
};
const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);
const msgsRef = ref(db, 'messages');
const settingsRef = ref(db, 'settings');
let settings = { eventName: 'MESSAGGI INDIE', eventSub: 'Sabato 7 Giugno · Arena Nord', accentColor: '#e8ff47' };
function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function lighten(hex) { let c=hex.replace('#',''); let r=Math.min(255,parseInt(c.slice(0,2),16)+60).toString(16).padStart(2,'0'); let g=Math.min(255,parseInt(c.slice(2,4),16)+60).toString(16).padStart(2,'0'); let b=Math.min(255,parseInt(c.slice(4,6),16)+60).toString(16).padStart(2,'0'); return '#'+r+g+b; }
function hexToRgba(hex,alpha) { hex=hex.replace('#',''); return `rgba(${parseInt(hex.slice(0,2),16)},${parseInt(hex.slice(2,4),16)},${parseInt(hex.slice(4,6),16)},${alpha})`; }
function initials(name) { if(!name||!name.trim()) return '?'; const p=name.trim().split(' '); return p.length>=2?(p[0][0]+p[1][0]).toUpperCase():name.slice(0,2).toUpperCase(); }
function fmtTime(ts) { const d=new Date(ts); return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0'); }
function showToast(msg,type='') { const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show '+type; setTimeout(()=>t.classList.remove('show'),2800); }

let allMessages = {};

onValue(settingsRef, snap => {
  if(snap.exists()) {
    settings = {...settings, ...snap.val()};
    document.getElementById('s-event-name').value = settings.eventName;
    document.getElementById('s-event-sub').value  = settings.eventSub;
    document.getElementById('s-color').value      = settings.accentColor;
    document.getElementById('s-color-hex').value  = settings.accentColor;
  }
});

onValue(msgsRef, snap => {
  allMessages = {};
  if(snap.exists()) snap.forEach(c => { allMessages[c.key] = {fbKey:c.key,...c.val()}; });
  renderDash();
});

function renderDash() {
  const msgs = Object.values(allMessages);
  const pending  = msgs.filter(m=>m.status==='pending');
  const approved = msgs.filter(m=>m.status==='approved');
  const rejected = msgs.filter(m=>m.status==='rejected');
  document.getElementById('stat-pending').textContent   = pending.length;
  document.getElementById('stat-approved').textContent  = approved.length;
  document.getElementById('stat-rejected').textContent  = rejected.length;
  document.getElementById('pending-count').textContent  = pending.length;
  document.getElementById('approved-count').textContent = approved.length;
  renderList('list-pending',  pending.sort((a,b)=>a.ts-b.ts), true);
  renderList('list-approved', approved.sort((a,b)=>b.ts-a.ts), false);
}

function renderList(id, items, isPending) {
  const c = document.getElementById(id);
  if(!items.length) {
    c.innerHTML = `<div class="empty-state"><div class="empty-icon">${isPending?'📭':'✅'}</div>${isPending?'Nessun messaggio in attesa':'Nessun messaggio approvato ancora'}</div>`;
    return;
  }
  c.innerHTML = items.map(m=>`
    <div class="msg-card ${m.status}">
      <div class="msg-avatar" style="background:linear-gradient(135deg,${settings.accentColor},${lighten(settings.accentColor)})">${initials(m.nome||'?')}</div>
      <div class="msg-body">
        <div class="msg-sender">
          <strong>${m.nome?escHtml(m.nome):'<em style="font-weight:400;color:var(--muted2)">Anonimo</em>'}</strong>
          <span class="msg-time">${fmtTime(m.ts)}</span>
        </div>
        <div class="msg-text">${escHtml(m.msg)}</div>
      </div>
      <div class="msg-actions">
        ${isPending
          ?`<button class="btn-approve" onclick="approveMsg('${m.fbKey}')">✓ Approva</button>
            <button class="btn-reject"  onclick="rejectMsg('${m.fbKey}')">✕ Rifiuta</button>`
          :`<button class="btn-undo" onclick="undoMsg('${m.fbKey}')">↩ Annulla</button>`}
      </div>
    </div>`).join('');
}

window.approveMsg = async k => { await update(ref(db,'messages/'+k),{status:'approved'}); showToast('✓ Approvato','success'); };
window.rejectMsg  = async k => { await remove(ref(db,'messages/'+k)); showToast('✕ Rifiutato'); };
window.undoMsg    = async k => { await update(ref(db,'messages/'+k),{status:'pending'}); showToast('↩ Rimesso in coda'); };

document.getElementById('s-color').addEventListener('input', function(){ document.getElementById('s-color-hex').value=this.value; });
document.getElementById('s-color-hex').addEventListener('input', function(){ if(/^#[0-9a-fA-F]{6}$/.test(this.value)) document.getElementById('s-color').value=this.value; });

window.applySettings = function() {
  settings.eventName   = document.getElementById('s-event-name').value.trim()||'EVENTO';
  settings.eventSub    = document.getElementById('s-event-sub').value.trim();
  settings.accentColor = document.getElementById('s-color-hex').value||document.getElementById('s-color').value;
  set(settingsRef, settings);
  showToast('✓ Impostazioni applicate','success');
};
</script>
</body>
</html>
