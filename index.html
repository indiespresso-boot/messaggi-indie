<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messaggi Indie</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --deep:#f2fafa;
  --card:#ffffff;
  --card2:#e8f9f9;
  --border:#c8eced;
  --accent:#f04e37;
  --accent2:#c93520;
  --teal:#1ec8d0;
  --green:#1a9e5c;
  --text:#111111;
  --muted:#5a8a8c;
  --muted2:#a0c8ca;
}
body { font-family:'DM Sans',sans-serif; background:var(--deep); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px 20px; position:relative; overflow:hidden; }
body::before { content:''; position:fixed; inset:0; background:radial-gradient(ellipse 60% 40% at 10% 0%,rgba(30,200,208,.1) 0%,transparent 55%),radial-gradient(ellipse 50% 50% at 90% 100%,rgba(240,78,55,.07) 0%,transparent 55%); pointer-events:none; }
@keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(1.4)} }
@keyframes pop-in { from{transform:scale(0);opacity:0} to{transform:scale(1);opacity:1} }
@keyframes spin { to{transform:rotate(360deg)} }
.toast { position:fixed; bottom:24px;left:50%; transform:translateX(-50%) translateY(80px); background:#111111; border:1px solid #333; border-radius:12px; padding:12px 20px; font-size:13px; font-weight:500; color:#fff; z-index:9999; transition:transform .3s cubic-bezier(.34,1.56,.64,1); white-space:nowrap; }
.toast.show { transform:translateX(-50%) translateY(0); }
.toast.success { border-color:rgba(26,158,92,.5); }
.toast.error { border-color:rgba(224,85,16,.5); }
.form-card { width:100%; max-width:400px; background:var(--card); border:1px solid var(--border); border-radius:24px; padding:32px 28px 28px; box-shadow:0 4px 40px rgba(30,200,208,.1),0 2px 12px rgba(0,0,0,.06); }
.form-event-tag { display:inline-flex; align-items:center; gap:6px; font-family:'Syne',sans-serif; font-size:10px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--teal); background:rgba(30,200,208,.08); border:1px solid rgba(30,200,208,.3); border-radius:20px; padding:4px 12px; margin-bottom:14px; }
.form-event-tag::before { content:''; width:6px; height:6px; border-radius:50%; background:var(--teal); animation:pulse-dot 1.4s ease-in-out infinite; }
.form-event-name { font-family:'Syne',sans-serif; font-size:22px; font-weight:900; color:var(--text); line-height:1.1; letter-spacing:-.03em; margin-bottom:4px; }
.form-event-sub { font-size:12px; color:var(--muted); margin-bottom:26px; padding-bottom:22px; border-bottom:1px solid var(--border); }
.f-label { font-size:10px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; color:var(--muted); margin-bottom:7px; display:flex; align-items:center; gap:6px; }
.f-label em { font-style:normal; font-weight:400; text-transform:none; letter-spacing:0; color:var(--muted2); font-size:10px; }
.f-input { width:100%; background:#faf9f7; border:1px solid var(--border); border-radius:11px; padding:12px 14px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:14px; outline:none; margin-bottom:16px; transition:border-color .2s,background .2s; resize:none; }
.f-input:focus { border-color:rgba(30,200,208,.6); background:rgba(30,200,208,.03); }
.f-input::placeholder { color:var(--muted2); }
.f-textarea { height:120px; line-height:1.55; }
.f-meta { display:flex; justify-content:flex-end; margin-top:-10px; margin-bottom:20px; }
.f-charcount { font-size:10px; color:var(--muted2); }
.f-charcount span { color:var(--accent); }
.f-charcount.warn span { color:var(--accent2); }

/* ── SELFIE SECTION ── */
.selfie-section { margin-bottom:20px; }
.selfie-label { font-size:10px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; display:flex; align-items:center; gap:6px; }
.selfie-label em { font-style:normal; font-weight:400; text-transform:none; letter-spacing:0; color:var(--muted2); font-size:10px; }
.selfie-trigger { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:13px 16px; background:#faf9f7; border:1px dashed var(--border); border-radius:11px; cursor:pointer; transition:all .2s; color:var(--muted); font-family:'DM Sans',sans-serif; font-size:13px; }
.selfie-trigger:hover { border-color:rgba(30,200,208,.5); color:var(--teal); background:rgba(30,200,208,.05); }
.selfie-trigger svg { flex-shrink:0; opacity:.7; }
#selfie-input { display:none; }
.selfie-preview-wrap { position:relative; display:none; margin-top:0; }
.selfie-preview { width:100%; height:180px; object-fit:cover; border-radius:11px; border:2px solid rgba(30,200,208,.4); display:block; }
.selfie-remove { position:absolute; top:8px; right:8px; width:28px; height:28px; border-radius:50%; background:rgba(0,0,0,.7); border:1px solid var(--border); color:var(--text); font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .15s; }
.selfie-remove:hover { background:rgba(255,77,109,.5); }
.selfie-uploading { display:none; align-items:center; justify-content:center; gap:10px; padding:13px; background:#faf9f7; border:1px solid var(--border); border-radius:11px; font-size:12px; color:var(--muted); }
.spinner { width:16px; height:16px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; }

.btn-send { width:100%; background:var(--accent); color:#ffffff; font-family:'Syne',sans-serif; font-size:13px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; border:none; border-radius:12px; padding:15px; cursor:pointer; transition:transform .15s,opacity .15s; display:flex; align-items:center; justify-content:center; gap:8px; }
.btn-send:hover { transform:translateY(-1px); opacity:.92; }
.btn-send:disabled { opacity:.4; cursor:not-allowed; transform:none; }
.f-privacy { font-size:10px; color:var(--muted2); text-align:center; margin-top:10px; line-height:1.5; }
.form-success { display:none; flex-direction:column; align-items:center; text-align:center; padding:20px 0 10px; gap:12px; }
.success-icon { font-size:40px; animation:pop-in .4s cubic-bezier(.34,1.56,.64,1); }
.success-title { font-family:'Syne',sans-serif; font-size:20px; font-weight:800; color:var(--text); }
.success-sub { font-size:13px; color:var(--muted); line-height:1.5; }
.btn-another { margin-top:8px; padding:10px 24px; background:transparent; border:1px solid var(--border); border-radius:10px; color:var(--muted); font-family:'Syne',sans-serif; font-size:12px; font-weight:700; cursor:pointer; transition:all .18s; }
.btn-another:hover { border-color:var(--accent); color:var(--accent); }

  <div class="form-event-sub" id="pub-event-sub">Sabato 7 Giugno · Arena Nord</div>
  <div id="form-body">
    <label class="f-label">Il tuo nome <em>(opzionale)</em></label>
    <input class="f-input" id="input-nome" type="text" placeholder="Es. Marco, Sara…" maxlength="40" autocomplete="off">
    <label class="f-label">Il tuo messaggio</label>
    <textarea class="f-input f-textarea" id="input-msg" placeholder="Scrivi il tuo messaggio…" maxlength="140"></textarea>
    <div class="f-meta">
      <div class="f-charcount" id="charcount"><span>0</span> / 140</div>
    </div>

    <!-- SELFIE SECTION -->
    <div class="selfie-section">
      <div class="selfie-label">Aggiungi una foto <em>(opzionale)</em></div>
      <label class="selfie-trigger" id="selfie-trigger">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        Scatta un selfie o scegli foto
        <input type="file" id="selfie-input" accept="image/*" capture="user">
      </label>
      <div class="selfie-preview-wrap" id="selfie-preview-wrap">
        <img class="selfie-preview" id="selfie-preview" src="" alt="preview">
        <button class="selfie-remove" id="selfie-remove" onclick="removeSelfie()" title="Rimuovi foto">✕</button>
      </div>
      <div class="selfie-uploading" id="selfie-uploading">
        <div class="spinner"></div> Caricamento foto…
      </div>
    </div>

    <button class="btn-send" id="btn-send" onclick="submitMsg()">Invia messaggio <span>→</span></button>
    <p class="f-privacy">Il tuo messaggio verrà moderato prima di apparire sullo schermo</p>
  </div>
  <div class="form-success" id="form-success">
    <div class="success-icon">🎶</div>
    <div class="success-title">Messaggio inviato!</div>
    <div class="success-sub">Il moderatore lo approverà a breve.<br>Tieni d'occhio lo schermo 👀</div>
    <button class="btn-another" onclick="resetForm()">Invia un altro messaggio</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyApLhRbbVD2J84mVLEx8yMHI93U-D-ofQQ",
  authDomain: "messaggi-indie.firebaseapp.com",
  databaseURL: "https://messaggi-indie-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "messaggi-indie",
  storageBucket: "messaggi-indie.firebasestorage.app",
  messagingSenderId: "955832496076",
  appId: "1:955832496076:web:77fdcbd958842f65673769"
};
const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);
const msgsRef = ref(db, 'messages');
const settingsRef = ref(db, 'settings');
let settings = { eventName: 'MESSAGGI INDIE', eventSub: 'Sabato 7 Giugno · Arena Nord', accentColor: '#f04e37' };

// Cloudinary config
const CLOUDINARY_CLOUD = 's3bknfy8';
const CLOUDINARY_PRESET = 'st7n5dku';
const CLOUDINARY_URL = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`;

let selfieDataURL = null;   // compressed image as dataURL
let selfieUploaded = null;  // Cloudinary secure_url after upload

function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show ' + type;
  setTimeout(() => t.classList.remove('show'), 2800);
}

onValue(settingsRef, snap => {
  if (snap.exists()) {
    settings = { ...settings, ...snap.val() };
    // Valida che il colore sia un hex valido, altrimenti usa il default giallo
    const raw = settings.accentColor || '#f04e37';
    const color = /^#[0-9a-fA-F]{6}$/.test(raw) ? raw : '#f04e37';
    settings.accentColor = color;
    const parts = settings.eventName.trim().split(' '), last = parts.pop(), rest = parts.join(' ');
    const el = document.getElementById('pub-event-name');
    if (el) el.innerHTML = (rest ? rest+' ' : '') + `<span style="color:${color}">${last}</span>`;
    const sub = document.getElementById('pub-event-sub');
    if (sub) sub.textContent = settings.eventSub;
    document.documentElement.style.setProperty('--accent', color);
  }
});

document.getElementById('input-msg').addEventListener('input', function() {
  const len = this.value.length;
  const cc = document.getElementById('charcount');
  cc.innerHTML = `<span>${len}</span> / 140`;
  cc.className = 'f-charcount' + (len > 120 ? ' warn' : '');
  updateSendBtn();
});
// Aggiorna subito il pulsante (attivo se c'è msg OPPURE foto)


// ── SELFIE ──────────────────────────────────────────────────

document.getElementById('selfie-input').addEventListener('change', async function(e) {
  const file = e.target.files[0];
  if (!file) return;
  selfieUploaded = null;

  // Preview istantanea dal file originale (senza compressione)
  const previewURL = URL.createObjectURL(file);
  selfieDataURL = previewURL;
  document.getElementById('selfie-preview').src = previewURL;
  document.getElementById('selfie-preview-wrap').style.display = 'block';
  document.getElementById('selfie-trigger').style.display = 'none';

  // Comprimi leggermente (1920px max, qualità 0.92) poi carica
  const compressed = await compressImage(file, 1600, 0.85);
  uploadToCloudinary(compressed, null);
});

async function compressImage(file, maxPx, quality) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        const ratio = Math.min(maxPx/w, maxPx/h, 1);
        w = Math.round(w * ratio); h = Math.round(h * ratio);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function uploadToCloudinary(dataURL, originalFile) {
  document.getElementById('selfie-uploading').style.display = 'flex';
  updateSendBtn();
  try {
    const formData = new FormData();
    formData.append('file', originalFile || dataURL);
    formData.append('upload_preset', CLOUDINARY_PRESET);
    const res = await fetch(CLOUDINARY_URL, { method:'POST', body:formData });
    const json = await res.json();
    if (json.secure_url) {
      selfieUploaded = json.secure_url;
    } else {
      showToast('⚠ Upload foto fallito', 'error');
      selfieUploaded = null;
    }
  } catch(err) {
    showToast('⚠ Errore upload foto', 'error');
    selfieUploaded = null;
  } finally {
    document.getElementById('selfie-uploading').style.display = 'none';
    updateSendBtn();
  }
}

window.removeSelfie = function() {
  selfieDataURL = null;
  selfieUploaded = null;
  document.getElementById('selfie-input').value = '';
  document.getElementById('selfie-preview-wrap').style.display = 'none';
  document.getElementById('selfie-trigger').style.display = 'flex';
  document.getElementById('selfie-uploading').style.display = 'none';
  updateSendBtn();
};

function isUploading() {
  return selfieDataURL !== null && selfieUploaded === null &&
         document.getElementById('selfie-uploading').style.display !== 'none';
}

function updateSendBtn() {
  const hasMsg = document.getElementById('input-msg').value.trim().length > 0;
  const hasPhoto = selfieUploaded !== null || (selfieDataURL !== null);
  const uploading = isUploading();
  const btn = document.getElementById('btn-send');
  // Abilitato se c'è almeno un messaggio OPPURE una foto (non mentre carica)
  btn.disabled = (!hasMsg && !hasPhoto) || uploading;
  if (uploading) {
    btn.innerHTML = 'Attendere foto… <div class="spinner" style="width:14px;height:14px;border-width:2px;border-color:rgba(0,0,0,.3);border-top-color:#0a0a0a"></div>';
  } else {
    btn.innerHTML = 'Invia messaggio <span>→</span>';
  }
}

document.getElementById('btn-send').disabled = true;

// ── SUBMIT ──────────────────────────────────────────────────

window.submitMsg = async function() {
  const nome = document.getElementById('input-nome').value.trim();
  const msg  = document.getElementById('input-msg').value.trim();
  if (!msg && !selfieUploaded) return;
  if (isUploading()) { showToast('Attendere il caricamento della foto…'); return; }
  // anti-spam: un invio ogni 30 secondi per dispositivo
  let last = 0;
  try { last = parseInt(localStorage.getItem('lastSend')) || 0; } catch(e) {}
  const wait = Math.ceil((last + 30000 - Date.now()) / 1000);
  if (wait > 0) { showToast('Attendi ' + wait + 's prima di inviare un altro messaggio', 'error'); return; }

  const btn = document.getElementById('btn-send');
  btn.disabled = true; btn.textContent = 'Invio…';
  try {
    const record = { nome: nome ? nome.slice(0,40) : null, msg: msg.slice(0,140), ts: Date.now(), status: 'pending' };
    if (selfieUploaded) record.photoURL = selfieUploaded;
    await push(msgsRef, record);
    try { localStorage.setItem('lastSend', String(Date.now())); } catch(e) {}
    document.getElementById('form-body').style.display = 'none';
    document.getElementById('form-success').style.display = 'flex';
  } catch(e) {
    showToast('⚠ Errore di connessione', 'error');
    btn.disabled = false; btn.innerHTML = 'Invia messaggio <span>→</span>';
  }
};

window.resetForm = function() {
  document.getElementById('input-nome').value = '';
  document.getElementById('input-msg').value = '';
  document.getElementById('charcount').innerHTML = '<span>0</span> / 140';
  document.getElementById('btn-send').disabled = true;
  document.getElementById('btn-send').innerHTML = 'Invia messaggio <span>→</span>';
  document.getElementById('form-body').style.display = 'block';
  document.getElementById('form-success').style.display = 'none';
  // reset selfie
  selfieDataURL = null; selfieUploaded = null;
  document.getElementById('selfie-input').value = '';
  document.getElementById('selfie-preview-wrap').style.display = 'none';
  document.getElementById('selfie-trigger').style.display = 'flex';
};
</script>
</body>
</html>
