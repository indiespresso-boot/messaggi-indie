<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live — Messaggi Indie</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --blue:#2a12b4; --blue-deep:#1d0a8a; --blue-dark:#14065f;
  --accent:#ff5d5e; --cyan:#13b7d0; --white:#ffffff;
  --font:'Fredoka','Trebuchet MS',sans-serif;
}
html, body { height:100%; }
body { font-family:var(--font); background:var(--blue); color:var(--white); overflow:hidden; position:relative; }

@keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(1.4)} }
@keyframes pop-in { from{transform:scale(.6) rotate(-3deg);opacity:0} to{transform:scale(1) rotate(0);opacity:1} }
@keyframes fade-up { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
@keyframes float-up { 0%{opacity:0;transform:translateY(0) rotate(0) scale(.4)} 12%{opacity:.7} 90%{opacity:.25} 100%{opacity:0;transform:translateY(-105vh) rotate(260deg) scale(1.3)} }
@keyframes wiggle { 0%,100%{transform:rotate(-4deg)} 50%{transform:rotate(4deg)} }
@keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }

.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px); background:var(--blue-deep); border:2px solid var(--cyan); border-radius:14px; padding:12px 20px; font-size:14px; font-weight:500; z-index:9999; transition:transform .3s cubic-bezier(.34,1.56,.64,1); white-space:nowrap; }
.toast.show { transform:translateX(-50%) translateY(0); }

/* ── SFONDO ── */
.live-bg { position:absolute; inset:0; z-index:0; background:var(--blue); }
.live-bg-gradient { position:absolute; inset:0; z-index:1; transition:background 1s; }
.live-bg::after { content:''; position:absolute; inset:0; background-image:radial-gradient(rgba(255,255,255,.07) 2px, transparent 2.5px); background-size:34px 34px; }
.particles { position:absolute; inset:0; z-index:2; overflow:hidden; pointer-events:none; }
.particle { position:absolute; opacity:0; animation:float-up linear infinite; }
.particle.round { border-radius:50%; }
.particle.bar { border-radius:4px; }

.live-corner { position:absolute; top:2.4vh; right:2vw; z-index:30; display:flex; align-items:center; gap:.6vw; font-weight:600; font-size:clamp(12px,1.1vw,22px); letter-spacing:.14em; color:var(--white); background:var(--accent); border-radius:99px; padding:.5vh 1.1vw; box-shadow:.25vw .25vw 0 var(--cyan); }
.live-dot { width:.7vw; height:.7vw; min-width:8px; min-height:8px; border-radius:50%; background:var(--white); animation:pulse-dot 1.4s ease-in-out infinite; }

/* ── SCHERMATA D'ATTESA (locandina) ── */
#wait-screen { position:absolute; inset:0; z-index:15; display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:5vh 3vw 4vh; transition:opacity .45s; }
#wait-screen.hidden { opacity:0; pointer-events:none; }
.wait-title { display:flex; align-items:center; gap:1.4vw; }
.wait-title h1 { font-weight:700; font-size:clamp(44px,8.2vw,170px); line-height:1; letter-spacing:-.03em; color:var(--accent); text-shadow:.045em .045em 0 var(--cyan); }
.wait-title svg { width:clamp(50px,7vw,140px); height:auto; animation:wiggle 3s ease-in-out infinite; transform-origin:50% 80%; filter:drop-shadow(.4vw .4vw 0 var(--cyan)); }
.wait-main { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:3vw; width:100%; max-width:2000px; }
.wait-side { font-weight:600; font-size:clamp(20px,3vw,64px); line-height:1.14; color:var(--accent); text-shadow:.06em .06em 0 var(--cyan); }
.wait-side b { font-weight:700; }
.wait-left { text-align:center; position:relative; }
.wait-right { text-align:center; }
.wait-arrow { width:clamp(80px,9vw,190px); height:auto; margin-top:1.5vh; filter:drop-shadow(.25vw .25vw 0 rgba(0,0,0,.25)); }
.qr-card { background:var(--white); border-radius:2.2vw; padding:1.6vw; box-shadow:1vw 1vw 0 var(--cyan), 0 2vw 6vw rgba(0,0,0,.35); animation:bob 4s ease-in-out infinite; }
.qr-card img { display:block; width:min(44vh,26vw); height:min(44vh,26vw); image-rendering:pixelated; }
.wait-logo { height:clamp(70px,17vh,300px); width:auto; }
.wait-status { position:absolute; bottom:1.8vh; left:3vw; font-size:clamp(12px,1.1vw,22px); font-weight:500; letter-spacing:.12em; text-transform:uppercase; color:rgba(255,255,255,.55); display:flex; align-items:center; gap:.7vw; }
.wait-status::before { content:''; width:.6vw; height:.6vw; min-width:7px; min-height:7px; border-radius:50%; background:var(--cyan); animation:pulse-dot 2s infinite; }

/* ── MESSAGGIO IN ONDA ── */
.live-content { position:relative; z-index:10; width:100%; height:100vh; display:flex; align-items:center; justify-content:center; padding:5vh 4vw; transition:padding .4s; }
body.with-qr .live-content { padding-right:29vw; }
.dedica-container { width:100%; display:flex; align-items:center; justify-content:center; min-height:0; }
.dedica-box { display:none; }

/* solo testo: fumetto */
.dedica-box.text-only { max-width:62vw; width:100%; flex-direction:column; align-items:flex-start; gap:7vh; }
body:not(.with-qr) .dedica-box.text-only { max-width:80vw; }
.bubble { position:relative; background:var(--white); color:var(--blue-deep); border-radius:3vw; padding:4.6vh 3.4vw; box-shadow:.9vw .9vw 0 var(--cyan); animation:pop-in .5s cubic-bezier(.34,1.56,.64,1); width:100%; }
.bubble::after { content:''; position:absolute; left:5vw; bottom:-4.4vh; width:5vw; height:5vh; background:var(--white); clip-path:polygon(0 0,100% 0,0 100%); }
.dedica-text { font-weight:600; font-size:clamp(28px,4.2vw,86px); line-height:1.16; letter-spacing:-.01em; word-break:break-word; }
.dedica-text.long { font-size:clamp(24px,3.2vw,64px); }
.dedica-sender { display:inline-block; margin-left:1.5vw; background:var(--accent); color:var(--white); font-weight:700; font-size:clamp(16px,2.2vw,44px); letter-spacing:.04em; text-transform:uppercase; border-radius:99px; padding:.8vh 2vw; box-shadow:.3vw .3vw 0 var(--cyan); animation:fade-up .5s .2s cubic-bezier(.22,1,.36,1) both; }

/* con foto: card sticker */
.dedica-box.has-photo { width:min(64vh,52vw); max-height:94vh; flex-direction:column; background:var(--white); border-radius:2vw; overflow:hidden; box-shadow:.9vw .9vw 0 var(--cyan), 0 2vw 6vw rgba(0,0,0,.35); animation:pop-in .5s cubic-bezier(.34,1.56,.64,1); }
body:not(.with-qr) .dedica-box.has-photo { width:min(68vh,66vw); }
.ig-header { display:flex; align-items:center; gap:1.2vw; padding:1.1vh 1.6vw; flex-shrink:0; background:var(--white); }
.ig-avatar { width:clamp(34px,3.4vw,66px); height:clamp(34px,3.4vw,66px); flex-shrink:0; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:clamp(16px,1.8vw,34px); color:var(--white); box-shadow:.2vw .2vw 0 var(--cyan); }
.ig-username { font-weight:700; font-size:clamp(16px,1.9vw,38px); letter-spacing:.03em; text-transform:uppercase; color:var(--blue-deep); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ig-live-dot { width:.8vw; height:.8vw; min-width:9px; min-height:9px; border-radius:50%; background:var(--accent); margin-left:auto; flex-shrink:0; animation:pulse-dot 1.8s infinite; }
.ig-photo-frame { width:100%; aspect-ratio:1/1; min-height:0; flex:0 1 auto; overflow:hidden; background:var(--blue-dark); }
.ig-photo-frame img { width:100%; height:100%; object-fit:cover; display:block; animation:fade-up .5s cubic-bezier(.22,1,.36,1); }
.ig-caption { flex-shrink:0; padding:1.2vh 1.6vw; background:var(--white); border-top:3px solid var(--blue-deep); }
.ig-caption-text { font-weight:500; font-size:clamp(16px,2.1vw,42px); line-height:1.25; color:var(--blue-deep); word-break:break-word; animation:fade-up .5s .1s cubic-bezier(.22,1,.36,1) both; }
.ig-actions { flex-shrink:0; display:flex; align-items:center; gap:1.6vw; padding:1vh 1.6vw 1.3vh; background:var(--white); }
.dedica-box.has-photo.no-caption .ig-actions { border-top:3px solid var(--blue-deep); }
.ig-action-btn { display:flex; align-items:center; gap:.6vw; background:none; border:none; cursor:default; padding:0; }
.ig-action-btn svg { width:clamp(22px,2.1vw,42px); height:clamp(22px,2.1vw,42px); stroke:var(--blue-deep); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.ig-action-btn.like svg { fill:var(--accent); stroke:var(--accent); animation:heartbeat .6s .3s cubic-bezier(.22,1,.36,1) both; }
@keyframes heartbeat { 0%{transform:scale(1)} 40%{transform:scale(1.35)} 70%{transform:scale(.9)} 100%{transform:scale(1)} }
.ig-action-count { font-weight:600; font-size:clamp(14px,1.7vw,34px); color:var(--blue-deep); }
.ig-save-btn { margin-left:auto; display:flex; }
.ig-save-btn svg { width:clamp(20px,1.9vw,38px); height:clamp(20px,1.9vw,38px); stroke:var(--blue-deep); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

/* QR laterale mentre compaiono i messaggi */
#qr-side { position:fixed; right:2.6vw; top:50%; transform:translateY(-50%) scale(.92); width:22vw; z-index:12; display:flex; flex-direction:column; align-items:center; gap:2.2vh; text-align:center; opacity:0; pointer-events:none; transition:opacity .45s, transform .45s; }
#qr-side.show { opacity:1; transform:translateY(-50%) scale(1); }
.qr-side-title, .qr-side-sub { font-weight:600; color:var(--accent); text-shadow:.06em .06em 0 var(--cyan); }
.qr-side-title { font-size:clamp(18px,2.3vw,46px); line-height:1.12; }
.qr-side-sub { font-size:clamp(15px,1.9vw,38px); line-height:1.15; }
.qr-side-title b, .qr-side-sub b { font-weight:700; }
.qr-side-code { width:100%; background:var(--white); border-radius:1.4vw; padding:.9vw; box-shadow:.55vw .55vw 0 var(--cyan), 0 1.4vw 4vw rgba(0,0,0,.3); }
.qr-side-code img { display:block; width:100%; height:auto; image-rendering:pixelated; }
.side-logo { position:fixed; left:2.4vw; bottom:3vh; height:clamp(50px,11vh,190px); width:auto; z-index:12; opacity:0; transition:opacity .45s; }
body.with-qr .side-logo { opacity:1; }

/* adesivo "+N in arrivo" */
.live-queue-info { position:absolute; top:2.4vh; left:2vw; z-index:30; font-weight:700; font-size:clamp(12px,1.3vw,26px); letter-spacing:.08em; text-transform:uppercase; color:var(--white); background:var(--accent); border-radius:99px; padding:.5vh 1.3vw; box-shadow:.25vw .25vw 0 var(--cyan); animation:pop-in .4s cubic-bezier(.34,1.56,.64,1); }
.live-queue-info:empty { display:none; }

/* carte in coda: ventaglio dietro il messaggio in onda, più piccole e sfocate */
.dedica-container { position:relative; isolation:isolate; }
.queue-ghost { position:absolute; left:50%; top:50%; z-index:-1; box-sizing:border-box; border:.45vw solid var(--white); border-radius:2vw; background:var(--accent) center/cover no-repeat; filter:blur(.45vw); opacity:0; pointer-events:none; transform:translate(-50%,-50%) scale(.8); transition:transform .6s cubic-bezier(.34,1.56,.64,1), opacity .5s; }
.queue-ghost.on { opacity:.85; }
.queue-ghost.g1.on { transform:translate(calc(-50% - 5.6vw),-50%) rotate(-5deg) scale(.94); }
.queue-ghost.g2.on { transform:translate(calc(-50% + 6vw),-50%) rotate(6deg) scale(.9); opacity:.7; }
.live-transition { position:absolute; inset:0; z-index:50; background:var(--blue-deep); opacity:0; pointer-events:none; transition:opacity .3s; }
.live-transition.flash { opacity:1; }
</style>
</head>
<body>
<div class="live-bg"></div>
<div class="live-bg-gradient" id="live-bg-gradient"></div>
<div class="particles" id="particles"></div>
<div class="live-corner"><div class="live-dot"></div>LIVE</div>

<!-- Schermata d'attesa: locandina INDIESMS -->
<div id="wait-screen">
  <div class="wait-title">
    <h1 id="wait-title-text">INDIESMS</h1>
    <svg viewBox="0 0 120 150" fill="none" aria-hidden="true">
      <rect x="6" y="40" width="64" height="104" rx="12" stroke="#ff5d5e" stroke-width="9"/>
      <circle cx="38" cy="126" r="5" fill="#ff5d5e"/>
      <path d="M62 8h46a10 10 0 0 1 10 10v26a10 10 0 0 1-10 10H92l-14 14V54h-16a10 10 0 0 1-10-10V18A10 10 0 0 1 62 8z" fill="#ff5d5e"/>
      <circle cx="68" cy="31" r="4.5" fill="#fff"/><circle cx="85" cy="31" r="4.5" fill="#fff"/><circle cx="102" cy="31" r="4.5" fill="#fff"/>
    </svg>
  </div>
  <div class="wait-main">
    <div class="wait-side wait-left">
      <div class="rich-text" data-field="textLeft">Hey bro…<br>scansiona<br>questo <b>QR CODE</b></div>
      <svg class="wait-arrow" viewBox="0 0 200 70" fill="none" aria-hidden="true">
        <path d="M10 14c40 48 110 52 172 14" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
        <path d="M150 12l34 16-26 24" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="qr-card"><img src="qr.png" alt="QR code per inviare un messaggio"></div>
    <div class="wait-side wait-right rich-text" data-field="textRight">e <b>INVIA</b> un sms sul nostro <b>MAXISCHERMO&nbsp;!</b></div>
  </div>
  <img class="wait-logo" src="logo.png" alt="Indie Espresso">
  <div class="wait-status" id="live-event-name">In attesa di messaggi</div>
</div>

<!-- QR laterale -->
<div id="qr-side">
  <div class="qr-side-title rich-text" data-field="textLeft">Hey bro…<br>scansiona<br>questo <b>QR CODE</b></div>
  <div class="qr-side-code"><img src="qr.png" alt="QR code"></div>
  <div class="qr-side-sub rich-text" data-field="textRight">e <b>INVIA</b> un sms sul nostro <b>MAXISCHERMO&nbsp;!</b></div>
</div>
<img class="side-logo" src="logo.png" alt="Indie Espresso">

<div class="live-content">
  <div class="dedica-container" id="dedica-container">
    <!-- Carte in coda (ventaglio dietro il messaggio) -->
    <div class="queue-ghost g1" id="queue-ghost-1"></div>
    <div class="queue-ghost g2" id="queue-ghost-2"></div>
    <!-- Solo testo -->
    <div class="dedica-box text-only" id="dedica-text-only">
      <div class="bubble"><div class="dedica-text" id="dedica-text"></div></div>
      <div class="dedica-sender" id="dedica-sender"></div>
    </div>

    <!-- Con foto -->
    <div class="dedica-box has-photo" id="dedica-photo-card">
      <div class="ig-header">
        <div class="ig-avatar" id="ig-avatar">♪</div>
        <div class="ig-username" id="ig-username"></div>
        <div class="ig-live-dot"></div>
      </div>
      <div class="ig-photo-frame">
        <img id="dedica-photo" src="" alt="">
      </div>
      <div class="ig-caption" id="ig-caption">
        <div class="ig-caption-text" id="ig-caption-text"></div>
      </div>
      <div class="ig-actions">
        <button class="ig-action-btn like" title="Mi piace">
          <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          <span class="ig-action-count" id="ig-like-count">1.847</span>
        </button>
        <button class="ig-action-btn" title="Commenta">
          <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span class="ig-action-count" id="ig-comment-count">234</span>
        </button>
        <button class="ig-action-btn" title="Condividi">
          <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
        <div class="ig-save-btn" title="Salva">
          <svg viewBox="0 0 24 24"><polygon points="19 21 12 16 5 21 5 3 19 3 19 21"/></svg>
        </div>
      </div>

  </div>
</div>
<div class="live-queue-info" id="live-queue-info"></div>
<div class="live-transition" id="live-transition"></div>
<div class="toast" id="toast"></div>
<div id="login" style="position:fixed;inset:0;z-index:10000;background:#2a12b4;display:none;align-items:center;justify-content:center;padding:20px;font-family:'Fredoka',sans-serif">
  <form id="login-form" style="width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px">
    <input id="l-user" type="email" placeholder="Email" autocomplete="username" style="padding:12px;border-radius:10px;border:0;font:inherit">
    <input id="l-pass" type="password" placeholder="Password" autocomplete="current-password" style="padding:12px;border-radius:10px;border:0;font:inherit">
    <div id="l-err" style="color:#ff5d5e;min-height:18px;font-size:14px"></div>
    <button type="submit" style="padding:12px;border-radius:10px;border:0;background:#ff5d5e;color:#fff;font:inherit;font-weight:600;cursor:pointer">Collega lo schermo</button>
  </form>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, remove, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
const firebaseConfig = {
  apiKey: "AIzaSyApLhRbbVD2J84mVLEx8yMHI93U-D-ofQQ",
  authDomain: "messaggi-indie.firebaseapp.com",
  databaseURL: "https://messaggi-indie-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "messaggi-indie",
  storageBucket: "messaggi-indie.firebasestorage.app",
  messagingSenderId: "955832496076",
  appId: "1:955832496076:web:77fdcbd958842f65673769"
};
const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);
const msgsRef = ref(db, 'messages');
const settingsRef = ref(db, 'settings');
const DEFAULT_ACCENT = '#ff5d5e';
let settings = { eventName: 'MESSAGGI INDIE', eventSub: '', accentColor: DEFAULT_ACCENT, duration: 8 };
// testi modificabili dal moderatore: *testo* = grassetto, a capo = nuova riga
const RICH_FIELDS = ['textLeft', 'textRight'];
function renderRich(el, text) {
  el.textContent = '';
  String(text).split('\n').forEach((line, i) => {
    if(i) el.appendChild(document.createElement('br'));
    line.split('*').forEach((part, j) => {
      if(!part) return;
      if(j % 2) { const b = document.createElement('b'); b.textContent = part; el.appendChild(b); }
      else el.appendChild(document.createTextNode(part));
    });
  });
}
function applyTexts() {
  if(typeof settings.title === 'string' && settings.title.trim()) document.getElementById('wait-title-text').textContent = settings.title;
  RICH_FIELDS.forEach(f => {
    if(typeof settings[f] !== 'string' || !settings[f].trim()) return;
    document.querySelectorAll(`.rich-text[data-field="${f}"]`).forEach(el => renderRich(el, settings[f]));
  });
}
function hexToRgba(hex,alpha) { hex=hex.replace('#',''); return `rgba(${parseInt(hex.slice(0,2),16)},${parseInt(hex.slice(2,4),16)},${parseInt(hex.slice(4,6),16)},${alpha})`; }

let allMessages = {};
let liveQueue = [];
let currentlyShowing = null;
let displayTimer = null;
let claiming = false;

onValue(settingsRef, snap => {
  if(snap.exists()) {
    settings = {...settings,...snap.val()};
    const raw = settings.accentColor || DEFAULT_ACCENT;
    const c = /^#[0-9a-fA-F]{6}$/.test(raw) ? raw : DEFAULT_ACCENT;
    settings.accentColor = c;
    applyTexts();
    const bg = document.getElementById('live-bg-gradient');
    if(bg) bg.style.background=`radial-gradient(ellipse 70% 55% at 8% 0%,rgba(19,183,208,.28) 0%,transparent 60%),radial-gradient(ellipse 60% 60% at 95% 100%,${hexToRgba(c,.22)} 0%,transparent 60%)`;
    document.documentElement.style.setProperty('--accent',c);
  }
});

// Login: i messaggi si leggono solo dopo l'accesso (le regole del database lo richiedono).
// Lo schermo accede una volta sola, poi Firebase ricorda la sessione.
const auth = getAuth(fbApp);
let firstSnap = true;
let msgsStarted = false;
function startMessages() {
  if(msgsStarted) return;
  msgsStarted = true;
  onValue(msgsRef, snap => {
    allMessages={};
    if(snap.exists()) snap.forEach(c=>{ allMessages[c.key]={fbKey:c.key,...c.val()}; });
    if(firstSnap) {
      firstSnap = false;
      // pulizia dei messaggi già mostrati in una sessione precedente
      Object.values(allMessages).filter(m=>m.status==='shown').forEach(m=>remove(ref(db,'messages/'+m.fbKey)));
    }
    syncQueue();
  });
}
onAuthStateChanged(auth, user => {
  document.getElementById('login').style.display = user ? 'none' : 'flex';
  if(user) startMessages();
});
document.getElementById('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('l-err');
  err.textContent = '';
  try {
    await signInWithEmailAndPassword(auth, document.getElementById('l-user').value.trim(), document.getElementById('l-pass').value);
    document.getElementById('l-pass').value = '';
  } catch(ex) {
    err.textContent = 'Credenziali non valide';
  }
});

function syncQueue() {
  const ids = new Set(liveQueue.map(x=>x.fbKey));
  Object.values(allMessages)
    .filter(m=>m.status==='approved'&&!ids.has(m.fbKey))
    .sort((a,b)=>a.ts-b.ts)
    .forEach(m=>liveQueue.push(m));
  updateQueueInfo();
  if(!currentlyShowing&&!claiming&&liveQueue.length>0) showNext();
}

async function showNext() {
  clearTimeout(displayTimer);
  // il messaggio appena concluso viene eliminato solo ora
  if(currentlyShowing) { remove(ref(db,'messages/'+currentlyShowing.fbKey)); currentlyShowing = null; }
  if(!liveQueue.length) { showWaiting(); return; }
  const msg = liveQueue.shift();
  // "prenota" il messaggio: se un altro schermo live l'ha già preso, passa al successivo
  let claimed = false;
  claiming = true;
  try {
    const res = await runTransaction(ref(db,'messages/'+msg.fbKey), cur => {
      if(cur && cur.status==='approved') { cur.status='shown'; return cur; }
      return; // annulla
    });
    claimed = res.committed;
  } catch(e) { claimed = false; }
  claiming = false;
  if(!claimed) { updateQueueInfo(); showNext(); return; }
  currentlyShowing = msg;
  updateQueueInfo();
  const ov = document.getElementById('live-transition');
  ov.classList.add('flash');
  setTimeout(()=>{ ov.classList.remove('flash'); renderMsg(msg); }, 300);
  clearTimeout(displayTimer);
  displayTimer = setTimeout(showNext, (settings.duration||8)*1000);
}

function renderMsg(msg) {
  document.getElementById('dedica-text-only').style.display='none';
  document.getElementById('dedica-photo-card').style.display='none';
  document.getElementById('wait-screen').classList.add('hidden');
  document.getElementById('qr-side').classList.add('show');
  document.body.classList.add('with-qr');

  const nome = msg.nome ? msg.nome : 'Anonimo';

  if(msg.photoURL) {
    // ── CARD CON FOTO ──
    const card = document.getElementById('dedica-photo-card');
    document.getElementById('ig-avatar').textContent = nome.charAt(0).toUpperCase();
    document.getElementById('ig-username').textContent = nome;
    const img = document.getElementById('dedica-photo');
    img.style.animation='none'; void img.offsetWidth; img.style.animation='';
    img.src = msg.photoURL;
    document.getElementById('ig-caption-text').textContent = msg.msg || '';
    document.getElementById('ig-caption').style.display = msg.msg ? 'block' : 'none';
    card.classList.toggle('no-caption', !msg.msg);
    card.style.display='flex';
  } else {
    // ── FUMETTO SOLO TESTO ──
    const box = document.getElementById('dedica-text-only');
    const dt = document.getElementById('dedica-text');
    const ds = document.getElementById('dedica-sender');
    ds.style.animation='none'; void ds.offsetWidth; ds.style.animation='';
    dt.textContent = msg.msg;
    dt.classList.toggle('long', (msg.msg||'').length > 80);
    ds.textContent = nome;
    box.style.display='flex';
    // riavvia l'animazione del fumetto
    const bubble = box.querySelector('.bubble');
    bubble.style.animation='none'; void bubble.offsetWidth; bubble.style.animation='';
  }
  // like/commenti random realistici
  document.getElementById('ig-like-count').textContent = (Math.floor(Math.random()*800)+800).toLocaleString('it-IT');
  document.getElementById('ig-comment-count').textContent = Math.floor(Math.random()*150)+80;
  spawnParticles();
  updateStack();
}

function showWaiting() {
  document.getElementById('dedica-text-only').style.display='none';
  document.getElementById('dedica-photo-card').style.display='none';
  document.getElementById('wait-screen').classList.remove('hidden');
  document.getElementById('qr-side').classList.remove('show');
  document.body.classList.remove('with-qr');
  document.getElementById('particles').innerHTML='';
  currentlyShowing=null; updateQueueInfo();
}

function updateQueueInfo() {
  const el=document.getElementById('live-queue-info');
  const n = currentlyShowing ? liveQueue.length : 0;
  const testo = n>0 ? `+${n} in arrivo` : '';
  if(el.textContent!==testo) el.textContent=testo;
  updateStack();
}

// ventaglio delle prossime 2 carte dietro il messaggio in onda
function updateStack() {
  const box = ['dedica-photo-card','dedica-text-only'].map(id=>document.getElementById(id)).find(b=>b.style.display==='flex');
  [0,1].forEach(i=>{
    const g = document.getElementById('queue-ghost-'+(i+1));
    const next = liveQueue[i];
    if(!box || !currentlyShowing || !next) { g.classList.remove('on'); return; }
    // stessa misura della carta in onda (offsetWidth/Height non risentono delle animazioni)
    g.style.width = box.offsetWidth+'px';
    g.style.height = box.offsetHeight+'px';
    const url = next.photoURL && /^https:\/\//i.test(next.photoURL) ? next.photoURL : '';
    g.style.backgroundImage = url ? `url("${url}")` : 'none';
    g.classList.add('on');
  });
}

function spawnParticles() {
  const container=document.getElementById('particles');
  container.innerHTML='';
  const colors=[settings.accentColor,'#13b7d0','#ffffff'];
  for(let i=0;i<20;i++){
    const p=document.createElement('div');
    p.className='particle '+(Math.random()>.5?'round':'bar');
    const size=6+Math.random()*12;
    p.style.cssText=`width:${size}px;height:${p.classList.contains('bar')?size/2.5:size}px;left:${Math.random()*100}%;bottom:${Math.random()*15}%;background:${colors[i%colors.length]};animation-duration:${5+Math.random()*6}s;animation-delay:${Math.random()*3}s`;
    container.appendChild(p);
  }
}
</script>
